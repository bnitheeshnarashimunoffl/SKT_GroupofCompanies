    <link rel="preload" as="image" href="/assets/hero-bg.webp" fetchpriority="high" />

    <!-- ── Critical CSS (Inline) ──────────────────────────────────────── -->
    <style>
      /* 
       * LCP STRATEGY: Hero image renders IMMEDIATELY at z-index:10.
       * The splash is just a text badge at z-index:20 — transparent,
       * so the image is always visible and becomes the LCP candidate
       * as soon as its bytes arrive (~1s on 3G for 196KB WebP).
       */

      *,:after,:before{box-sizing:border-box;margin:0;padding:0}

      html{overflow-x:clip}
      body{overflow-x:clip;font-family:'Satoshi',sans-serif;background:#eaeaef;color:#1a1a1a}

      /* Hero image — visible from byte 1, no JS or CSS file needed */
      #hero-lcp{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:10}
      #hero-veil{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(234,234,239,.82),rgba(234,234,239,.78) 40%,rgba(234,234,239,.85) 70%,rgba(234,234,239,.95));z-index:11}

      /* Splash: transparent text badge, NOT a full-screen block */
      #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none;background:transparent;transition:opacity .3s ease}
      #splash.hidden{opacity:0}
      .splash-badge{font-family:'Clash Display',sans-serif;font-size:1.5rem;font-weight:700;color:#96352c;letter-spacing:.05em;background:rgba(234,234,239,.85);padding:.5rem 1.5rem;border-radius:8px}

      /* React content sits above the veil */
      #root{position:relative;z-index:15;min-height:100vh;opacity:0;transition:opacity .3s ease}
      #root.ready{opacity:1}

      /* 5-second failsafe */
    </style>

    <!-- ── Splash Failsafe ────────────────────────────────────────────── -->
    <script>
      setTimeout(function(){
        var s=document.getElementById('splash');
        if(s){s.style.opacity='0';s.classList.add('hidden')}
      },5000)
    </script>
